name = "scriptle-daily-email"
main = "index.js"
compatibility_date = "2026-01-01"

# 13:00 UTC = 8:00 AM EST / 9:00 AM EDT
[triggers]
crons = ["0 13 * * *"]

[vars]
SITE_URL = "https://scriptle.net"
EMAIL_FROM = "Scriptle <daily@scriptle.net>"
EMAIL_FROM_ADDRESS = "daily@scriptle.net"
EMAIL_FROM_NAME = "Scriptle"

[[kv_namespaces]]
binding = "SUBSCRIBERS_KV"
id = "2ce804e1ff7a41679b2b1e957a998363"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["daily@scriptle.net"]
